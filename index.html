<!DOCTYPE html>
<head>
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h2>To-Do List</h2>
        <h4>By: Omar Ismail</h4>
    </header>   

    <section id="filters" class="radio-group">
        <label>
            <input type="radio" name="filter" value="All" class="filters" checked>
            <span>All</span>
        </label>
        <label>
            <input type="radio" name="filter" value="Pending" class="filters">
            <span>Pending</span>
        </label>
        <label>
            <input type="radio" name="filter" value="Completed" class="filters">
            <span>Completed</span>
        </label>
    </section>

    <section id="buttons">
        <input type="button" value="Add Task" id="addtask" class="buttons">
        <input type="button" value="Clear All" id="clearall" class="buttons">
        <br>
    </section>

    <section id="todo">
        <ul id="list">
        </ul>
    </section>
    <script src="script.js"></script>
</body>
